<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Signup | Hospital Appointment System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #1e293b;
            --muted: #64748b;
            --bg: #f4f7fb;
            --card: #ffffff;
            --border: #dbe3ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 12px 34px rgba(15, 23, 42, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f8fafc;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            width: 100%;
            border: none;
            background: var(--primary);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: var(--muted);
        }

        .footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        @media (max-width: 680px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Doctor Signup</h1>
                <p>Create your doctor account and manage your consultation slots.</p>
            </div>

            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}

            <form method="POST">
                {% csrf_token %}

                <div class="grid">
                    <div class="form-group">
                        <label for="doctor_name">Doctor Name</label>
                        <input type="text" id="doctor_name" name="doctor_name" required placeholder="Dr. Name">
                    </div>

                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <input type="text" id="specialization" name="specialization" required placeholder="Cardiologist">
                    </div>

                    <div class="form-group">
                        <label for="qualification">Qualification</label>
                        <input type="text" id="qualification" name="qualification" required placeholder="MBBS, MD">
                    </div>

                    <div class="form-group">
                        <label for="experience">Experience</label>
                        <input type="number" id="experience" name="experience" required placeholder="5">
                    </div>

                    <div class="form-group">
                        <label for="consultation_fee">Consultation Fee</label>
                        <input type="number" id="consultation_fee" name="consultation_fee" required placeholder="500">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" name="phone" required placeholder="9876543210">
                    </div>

                    <div class="form-group full">
                        <label for="hospital">Hospital</label>
                        <select id="hospital" name="hospital" required>
                            <option value="">Select Hospital</option>
                            {% for hospital in hospitals %}
                                <option value="{{ hospital.id }}">{{ hospital.hospital_name }} - {{ hospital.city }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="username">Login Username</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>

                    <div class="form-group full">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn">Create Doctor Account</button>
            </form>

            <div class="footer">
                Already registered?
                <a href="{% url 'doctor_login' %}">Doctor Login</a>
            </div>
        </div>
    </div>
</body>
</html>
