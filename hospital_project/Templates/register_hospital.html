<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Hospital | Hospital Appointment System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #1e293b;
            --muted: #64748b;
            --bg: #f4f7fb;
            --card: #ffffff;
            --border: #dbe3ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 12px 34px rgba(15, 23, 42, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f8fafc;
            font-size: 15px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        textarea {
            min-height: 95px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            width: 100%;
            border: none;
            background: var(--primary);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 680px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Register Hospital</h1>
                <p>Add hospital details from this custom webpage. No Django admin required.</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="grid">
                    <div class="form-group full">
                        <label for="hospital_name">Hospital Name</label>
                        <input type="text" id="hospital_name" name="hospital_name" required placeholder="CityCare Hospital">
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" required placeholder="Patia">
                    </div>

                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" required placeholder="Bhubaneswar">
                    </div>

                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" required placeholder="Odisha">
                    </div>

                    <div class="form-group">
                        <label for="contact_number">Contact Number</label>
                        <input type="text" id="contact_number" name="contact_number" required placeholder="9876543210">
                    </div>

                    <div class="form-group full">
                        <label for="email">Hospital Email</label>
                        <input type="email" id="email" name="email" required placeholder="hospital@example.com">
                    </div>

                    <div class="form-group full">
                        <label for="address">Full Address</label>
                        <textarea id="address" name="address" required placeholder="Enter full hospital address"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn">Register Hospital</button>
            </form>

            <a href="{% url 'manage_hospitals' %}" class="back">View Registered Hospitals</a>
        </div>
    </div>
</body>
</html>
